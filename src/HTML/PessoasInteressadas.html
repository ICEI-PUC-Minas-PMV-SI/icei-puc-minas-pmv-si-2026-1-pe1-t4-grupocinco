<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gerenciar Adotantes - AdotaPet</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="/CSS/PessoasInteressadas.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="header">
      <div class="logo">🐾 AdotaPet</div>

      <nav class="nav">
        <a href="TelaExibição.html">Início</a>
        <a href="PessoasInteressadas.html" class="active">Interessados</a>
        <a href="TelaExibição.html">Pets</a>
        <a href="mensagens.html">Mensagens</a>
        <a href="perfildoador.html">Perfil</a>
      </nav>

      <div class="header-right">
        <input type="text" placeholder="Buscar adotantes..." />

        <div class="user">
          <img
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
            alt="Usuário"
          />
        </div>
      </div>
    </header>

    <!-- MAIN -->

    <main class="container">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="filter-card">
          <div class="filter-top">
            <h3>Filtros</h3>

            <button id="clearFilters" class="clear-btn">Limpar</button>
          </div>

          <label>Faixa Etária</label>

          <select>
            <option>Todas</option>
            <option>18 - 25</option>
            <option>26 - 35</option>
            <option>36 - 50</option>
          </select>

          <label>Experiência com Pets</label>

          <select>
            <option>Todos</option>
            <option>Iniciante</option>
            <option>Intermediário</option>
            <option>Experiente</option>
          </select>

          <label>Tipo de Moradia</label>

          <select>
            <option>Todos</option>
            <option>Casa</option>
            <option>Apartamento</option>
          </select>

          <label>Localização</label>

          <input type="text" placeholder="Cidade ou estado" />

          <button class="filter-btn">Aplicar filtros</button>
        </div>
      </aside>

      <!-- CONTENT -->

      <section class="content">
        <div class="content-top">
          <div>
            <h1>Visualize e gerencie perfis de adotantes</h1>

            <p class="description">
              Explore os perfis dos interessados em adoção e encontre o lar
              ideal para cada pet.
            </p>
          </div>

          <span class="results"> 0 adotantes encontrados </span>
        </div>

        <!-- GRID GERADA PELO JAVASCRIPT -->

        <div class="adopters-grid" id="adoptersGrid"></div>
      </section>
    </main>

    <!-- JS -->

    <script src="/Javascript/PessoasInteressadas.js"></script>
  </body>
</html>
